<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEAM SHOOTER SVG - Advanced Vector Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* SVG Glow and Effect Styles */
        .neon-text-blue {
            text-shadow: 0 0 8px #38bdf8, 0 0 20px #0284c7;
        }
        .neon-text-red {
            text-shadow: 0 0 8px #f43f5e, 0 0 20px #e11d48;
        }
        .glow-box {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.5);
        }

        /* Animated grid background */
        .bg-cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(14, 165, 233, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(14, 165, 233, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Touch Button Active effect */
        .btn-touch:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }

        @keyframes pulse-warning {
            0%, 100% { opacity: 0.2; transform: scale(0.98); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }
        .animate-warning {
            animation: pulse-warning 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-2 md:p-4 bg-cyber-grid relative">

    <!-- Top Header / HUD Area -->
    <header class="w-full max-w-lg bg-slate-900/90 rounded-xl p-3 border border-sky-500/30 backdrop-blur-md shadow-lg z-10 flex flex-col gap-2">
        <!-- Title -->
        <div class="flex items-center justify-between border-b border-sky-500/20 pb-1">
            <h1 class="text-lg md:text-xl font-black italic tracking-wider text-sky-400 flex items-center gap-2 neon-text-blue">
                🚀 ビームシューター <span class="text-xs px-2 py-0.5 rounded bg-sky-500/20 border border-sky-400/40 text-sky-300 font-normal">SVG 2026</span>
            </h1>
            <div id="boss-timer-display" class="text-xs font-bold text-amber-400 animate-pulse">
                ボス登場まで: <span id="boss-timer-val">30</span>秒
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="grid grid-cols-4 gap-1 text-center text-xs">
            <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700">
                <div class="text-slate-400 text-[10px]">スコア</div>
                <div id="score-val" class="font-bold text-sky-300 text-sm md:text-base">0</div>
            </div>
            <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700">
                <div class="text-slate-400 text-[10px]">ハイスコア</div>
                <div id="hiscore-val" class="font-bold text-emerald-400 text-sm md:text-base">0</div>
            </div>
            <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700">
                <div class="text-slate-400 text-[10px]">ライフ</div>
                <div id="lives-val" class="text-rose-500 flex justify-center items-center gap-0.5 text-xs md:text-sm">❤️❤️❤️</div>
            </div>
            <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700">
                <div class="text-slate-400 text-[10px]">パワー/バリ/ボム</div>
                <div class="font-bold text-amber-300 text-[11px] md:text-xs">
                    P:<span id="power-val">1</span> B:<span id="barrier-val">1</span> 💣:<span id="bomb-val">2</span>
                </div>
            </div>
        </div>

        <!-- Boss Health Bar (Hidden initially) -->
        <div id="boss-hp-container" class="hidden w-full bg-slate-950 rounded-full h-3.5 border border-rose-500/50 p-0.5 relative overflow-hidden">
            <div id="boss-hp-bar" class="h-full bg-gradient-to-r from-amber-500 via-rose-500 to-red-600 rounded-full w-full transition-all duration-100 shadow-[0_0_10px_#f43f5e]"></div>
            <div class="absolute inset-0 flex items-center justify-center text-[9px] font-black tracking-widest text-white drop-shadow">
                GIGA-MECH EMPEROR [BOSS]
            </div>
        </div>
    </header>

    <!-- Main Game Viewport -->
    <main class="relative w-full max-w-lg flex-1 my-2 rounded-2xl overflow-hidden glow-box bg-slate-950/90 flex items-center justify-center">
        
        <!-- WARNING OVERLAY FOR BOSS -->
        <div id="boss-warning-overlay" class="hidden absolute inset-0 bg-red-950/40 z-20 flex flex-col items-center justify-center pointer-events-none animate-warning">
            <div class="text-red-500 font-black text-3xl tracking-widest border-y-2 border-red-500 py-2 px-8 bg-slate-950/80 neon-text-red">
                ⚠️ WARNING ⚠️
            </div>
            <div class="text-red-300 font-bold text-sm mt-2 tracking-wider">GIANT MECH EMPEROR APPROACHING</div>
        </div>

        <!-- GAME OVER / CLEAR OVERLAY -->
        <div id="game-overlay" class="hidden absolute inset-0 bg-slate-950/90 z-30 flex flex-col items-center justify-center p-6 text-center backdrop-blur-md">
            <h2 id="overlay-title" class="text-3xl font-black mb-2 text-sky-400 neon-text-blue">GAME OVER</h2>
            <p id="overlay-desc" class="text-slate-300 text-sm mb-6">スコア: <span id="final-score" class="text-amber-400 font-bold">0</span></p>
            <button id="restart-btn" class="px-8 py-3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-sky-500/30 transition transform active:scale-95 border border-sky-300/40">
                RESTART GAME
            </button>
        </div>

        <!-- SVG WORLD (100% Vector Rendering) -->
        <svg id="game-svg" viewBox="0 0 500 700" class="w-full h-full cursor-crosshair select-none">
            <defs>
                <!-- SVG TECH TECH 1: Multi-stage Neon Glow Filter -->
                <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- SVG TECH 2: Energy Distortion Filter (feTurbulence & feDisplacementMap) -->
                <filter id="shield-distortion">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- SVG TECH 3: Multi-stop Metallic & Plasma Gradients -->
                <linearGradient id="player-hull" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="50%" stop-color="#0284c7"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
                <linearGradient id="boss-hull" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#475569"/>
                    <stop offset="30%" stop-color="#1e293b"/>
                    <stop offset="70%" stop-color="#0f172a"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>
                <radialGradient id="core-plasma" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="30%" stop-color="#f43f5e"/>
                    <stop offset="70%" stop-color="#881337"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="player-core" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#06b6d4"/>
                    <stop offset="100%" stop-color="#083344"/>
                </radialGradient>

                <!-- Enemy Color Gradients -->
                <linearGradient id="enemy-red" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#881337"/>
                </linearGradient>
                <linearGradient id="enemy-orange" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#9a3412"/>
                </linearGradient>
                <linearGradient id="enemy-lime" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#a3e635"/><stop offset="100%" stop-color="#3f6212"/>
                </linearGradient>
                <linearGradient id="enemy-purple" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#581c87"/>
                </linearGradient>

                <!-- SVG TECH 4: Holographic Hexagon Mesh Pattern -->
                <pattern id="hex-mesh" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
                    <path d="M8 0 L16 4 L16 12 L8 16 L0 12 L0 4 Z" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
                </pattern>
                <pattern id="boss-hex-mesh" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M10 0 L20 5 L20 15 L10 20 L0 15 L0 5 Z" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
                </pattern>

                <!-- SVG TECH 5: Advanced ClipPaths for Mech Slits & Armor Cuts -->
                <clipPath id="player-wing-clip">
                    <polygon points="25,0 50,40 40,50 25,35 10,50 0,40"/>
                </clipPath>
                <clipPath id="boss-core-clip">
                    <circle cx="0" cy="0" r="45"/>
                </clipPath>
            </defs>

            <!-- Starfield Background Group -->
            <g id="starfield-group"></g>

            <!-- Projectiles Group -->
            <g id="player-bullets-group"></g>
            <g id="enemy-bullets-group"></g>

            <!-- Particles and FX Group -->
            <g id="particles-group"></g>

            <!-- Enemies Group -->
            <g id="enemies-group"></g>

            <!-- PLAYER SHIP (UPWARD FACING 🚀) -->
            <g id="player-ship" transform="translate(250, 580)">
                <!-- Engine Thruster Flame (Dynamic Pulse) -->
                <polygon id="player-engine-fire" points="-8,20 0,42 8,20" fill="#38bdf8" filter="url(#neon-glow)" opacity="0.9"/>
                <polygon points="-4,20 0,32 4,20" fill="#ffffff"/>

                <!-- Main Wings -->
                <path d="M0,-28 L28,18 L18,24 L0,12 L-18,24 L-28,18 Z" fill="url(#player-hull)" stroke="#0284c7" stroke-width="1.5"/>
                <!-- Wing Armor Slits -->
                <path d="M12,0 L24,14 M-12,0 L-24,14" stroke="#38bdf8" stroke-width="1.5" filter="url(#neon-glow)"/>

                <!-- Cockpit & Core -->
                <polygon points="0,-22 10,2 -10,2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
                <circle cx="0" cy="-4" r="6" fill="url(#player-core)" filter="url(#neon-glow)"/>

                <!-- Dual Cannon Guns -->
                <rect x="-20" y="-12" width="3" height="16" fill="#64748b" rx="1.5"/>
                <rect x="17" y="-12" width="3" height="16" fill="#64748b" rx="1.5"/>

                <!-- SVG TECH 6: Dynamic Dasharray Shield Barrier Ring -->
                <g id="player-barrier" opacity="0">
                    <circle cx="0" cy="0" r="36" fill="url(#hex-mesh)" stroke="#38bdf8" stroke-width="2" 
                            stroke-dasharray="12 6 4 6" filter="url(#shield-distortion)"/>
                    <circle cx="0" cy="0" r="36" fill="none" stroke="#67e8f9" stroke-width="1" filter="url(#neon-glow)"/>
                </g>
            </g>

            <!-- GIANT BOSS SHIP (10x Size Complex Mech System - Downward Facing 🛸) -->
            <g id="boss-ship" transform="translate(250, -250)" class="transition-transform duration-300">
                <!-- Boss Outer Energy Aura -->
                <circle cx="0" cy="0" r="140" fill="url(#boss-hex-mesh)" opacity="0.2" filter="url(#shield-distortion)"/>

                <!-- SVG TECH 7: Joint Vector Dynamic Rotating Ring Outer Frame -->
                <g id="boss-rotator-ring">
                    <circle cx="0" cy="0" r="115" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="30 15 10 15" stroke-opacity="0.6"/>
                    <circle cx="0" cy="0" r="105" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="8 8"/>
                </g>

                <!-- Heavy Armor Wings/Structure -->
                <path d="M-130,-70 L-70,50 L-30,90 L30,90 L70,50 L130,-70 L80,-90 L0,-40 L-80,-90 Z" fill="url(#boss-hull)" stroke="#64748b" stroke-width="3"/>

                <!-- Left Arm System (Articulated Gun Mount) -->
                <g id="boss-left-arm" transform="translate(-85, 20)">
                    <rect x="-15" y="0" width="30" height="50" fill="#334155" rx="4" stroke="#f43f5e"/>
                    <polygon points="-8,50 0,85 8,50" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
                    <circle cx="0" cy="20" r="8" fill="#f43f5e" filter="url(#neon-glow)"/>
                </g>

                <!-- Right Arm System (Articulated Gun Mount) -->
                <g id="boss-right-arm" transform="translate(85, 20)">
                    <rect x="-15" y="0" width="30" height="50" fill="#334155" rx="4" stroke="#f43f5e"/>
                    <polygon points="-8,50 0,85 8,50" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
                    <circle cx="0" cy="20" r="8" fill="#f43f5e" filter="url(#neon-glow)"/>
                </g>

                <!-- Center Mega Beam Cannon Mouth -->
                <polygon points="-25,40 0,105 25,40" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
                <line x1="0" y1="40" x2="0" y2="100" stroke="#f43f5e" stroke-width="4" filter="url(#heavy-glow)"/>

                <!-- SVG TECH 8: Dynamic Plasma Core Matrix -->
                <circle cx="0" cy="-10" r="42" fill="#090d16" stroke="#f43f5e" stroke-width="2"/>
                <circle id="boss-core-element" cx="0" cy="-10" r="32" fill="url(#core-plasma)" filter="url(#heavy-glow)"/>
                <!-- Core Hex Overlay -->
                <circle cx="0" cy="-10" r="32" fill="url(#boss-hex-mesh)"/>

                <!-- Armor Vent Lights -->
                <line x1="-50" y1="-40" x2="-20" y2="-20" stroke="#06b6d4" stroke-width="3" filter="url(#neon-glow)"/>
                <line x1="50" y1="-40" x2="20" y2="-20" stroke="#06b6d4" stroke-width="3" filter="url(#neon-glow)"/>
            </g>
        </svg>
    </main>

    <!-- Touch Controller / Buttons Area -->
    <footer class="w-full max-w-lg bg-slate-900/80 rounded-xl p-2.5 border border-slate-800 backdrop-blur-md flex items-center justify-between gap-2 z-10">
        <!-- D-PAD Navigation -->
        <div class="grid grid-cols-3 gap-1 w-32 h-32 shrink-0">
            <div></div>
            <button id="btn-up" class="btn-touch bg-slate-800 border border-slate-600 rounded-lg flex items-center justify-center text-sky-400 font-bold text-lg active:bg-sky-600">↑</button>
            <div></div>
            <button id="btn-left" class="btn-touch bg-slate-800 border border-slate-600 rounded-lg flex items-center justify-center text-sky-400 font-bold text-lg active:bg-sky-600">←</button>
            <div class="bg-slate-950/50 rounded-lg flex items-center justify-center text-[10px] text-slate-500">PAD</div>
            <button id="btn-right" class="btn-touch bg-slate-800 border border-slate-600 rounded-lg flex items-center justify-center text-sky-400 font-bold text-lg active:bg-sky-600">→</button>
            <div></div>
            <button id="btn-down" class="btn-touch bg-slate-800 border border-slate-600 rounded-lg flex items-center justify-center text-sky-400 font-bold text-lg active:bg-sky-600">↓</button>
            <div></div>
        </div>

        <!-- Action Buttons (Shot / Bomb) -->
        <div class="flex items-center gap-3 flex-1 justify-end">
            <!-- Shot Button -->
            <button id="btn-shot" class="btn-touch w-20 h-20 bg-gradient-to-br from-emerald-500 to-teal-700 rounded-2xl border-2 border-emerald-300 shadow-lg shadow-emerald-500/20 flex flex-col items-center justify-center text-white active:scale-95">
                <span class="text-xl">🔫</span>
                <span class="text-[10px] font-black tracking-wider mt-0.5">BEAM</span>
            </button>
            <!-- Bomb Button -->
            <button id="btn-bomb" class="btn-touch w-20 h-20 bg-gradient-to-br from-rose-500 to-red-700 rounded-2xl border-2 border-rose-300 shadow-lg shadow-rose-500/20 flex flex-col items-center justify-center text-white active:scale-95">
                <span class="text-xl">💣</span>
                <span class="text-[10px] font-black tracking-wider mt-0.5">BOMB</span>
            </button>
        </div>
    </footer>

    <script>
        /* === Web Audio Synthesizer (Zero External Dependencies) === */
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
            playExplode() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            playBossWarning() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundEngine();

        // SVG & Game Setup
        const svg = document.getElementById('game-svg');
        const starfieldGroup = document.getElementById('starfield-group');
        const playerBulletsGroup = document.getElementById('player-bullets-group');
        const enemyBulletsGroup = document.getElementById('enemy-bullets-group');
        const enemiesGroup = document.getElementById('enemies-group');
        const particlesGroup = document.getElementById('particles-group');
        const playerShip = document.getElementById('player-ship');
        const playerEngineFire = document.getElementById('player-engine-fire');
        const playerBarrier = document.getElementById('player-barrier');

        const bossShip = document.getElementById('boss-ship');
        const bossRotator = document.getElementById('boss-rotator-ring');
        const bossLeftArm = document.getElementById('boss-left-arm');
        const bossRightArm = document.getElementById('boss-right-arm');
        const bossHpContainer = document.getElementById('boss-hp-container');
        const bossHpBar = document.getElementById('boss-hp-bar');

        // State
        let score = 0;
        let hiScore = localStorage.getItem('beam_shoots_hiscore') || 0;
        let lives = 3;
        let power = 1;
        let barrier = 1;
        let bombs = 2;
        let bossTimer = 25;
        let gameState = 'PLAYING'; // PLAYING, BOSS_WARNING, BOSS_STAGE, GAMEOVER

        // Coordinates
        const player = { x: 250, y: 580, vx: 0, vy: 0, speed: 6, width: 40, height: 40 };
        const keys = { Up: false, Down: false, Left: false, Right: false, Shot: false };
        
        let playerBullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Boss Object State
        const boss = {
            active: false,
            x: 250,
            y: -250,
            targetY: 150,
            hp: 500,
            maxHp: 500,
            width: 220,
            height: 200,
            rotAngle: 0,
            armOffset: 0,
            shootTimer: 0
        };

        document.getElementById('hiscore-val').innerText = hiScore;

        // Generate Starfield
        for (let i = 0; i < 45; i++) {
            const star = {
                x: Math.random() * 500,
                y: Math.random() * 700,
                r: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 2 + 1
            };
            stars.push(star);
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", star.x);
            circle.setAttribute("cy", star.y);
            circle.setAttribute("r", star.r);
            circle.setAttribute("fill", "#ffffff");
            circle.setAttribute("opacity", Math.random() * 0.7 + 0.3);
            starfieldGroup.appendChild(circle);
            star.elem = circle;
        }

        // Input Event Listeners
        window.addEventListener('keydown', (e) => {
            sound.init();
            if (e.key === 'ArrowUp' || e.key === 'w') keys.Up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.Down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.Right = true;
            if (e.key === ' ' || e.key === 'z') spawnPlayerBullet();
            if (e.key === 'x') triggerBomb();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.Up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.Down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.Right = false;
        });

        // Touch Control Buttons Binding
        const bindTouchBtn = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); sound.init(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => { sound.init(); keys[keyName] = true; });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; });
        };
        bindTouchBtn('btn-up', 'Up');
        bindTouchBtn('btn-down', 'Down');
        bindTouchBtn('btn-left', 'Left');
        bindTouchBtn('btn-right', 'Right');

        document.getElementById('btn-shot').addEventListener('click', () => { sound.init(); spawnPlayerBullet(); });
        document.getElementById('btn-bomb').addEventListener('click', () => { sound.init(); triggerBomb(); });
        document.getElementById('restart-btn').addEventListener('click', () => { location.reload(); });

        // Direct Touch Drag Control for Ship on Canvas
        let isDragging = false;
        svg.addEventListener('pointerdown', (e) => { sound.init(); isDragging = true; updatePlayerPosPointer(e); });
        svg.addEventListener('pointermove', (e) => { if (isDragging) updatePlayerPosPointer(e); });
        svg.addEventListener('pointerup', () => { isDragging = false; });

        function updatePlayerPosPointer(e) {
            const rect = svg.getBoundingClientRect();
            const scaleX = 500 / rect.width;
            const scaleY = 700 / rect.height;
            player.x = (e.clientX - rect.left) * scaleX;
            player.y = (e.clientY - rect.top) * scaleY - 30;
            // Constrain
            player.x = Math.max(20, Math.min(480, player.x));
            player.y = Math.max(20, Math.min(680, player.y));
        }

        // SVG TECH 9: Vector Enemy Ships Generation (Downward Facing 🛩️)
        const ENEMY_TYPES = [
            { type: 'red-scout', color: 'url(#enemy-red)', hp: 2, score: 100 },
            { type: 'orange-sniper', color: 'url(#enemy-orange)', hp: 3, score: 150 },
            { type: 'lime-bug', color: 'url(#enemy-lime)', hp: 1, score: 80 },
            { type: 'purple-bomber', color: 'url(#enemy-purple)', hp: 4, score: 200 }
        ];

        function spawnEnemy() {
            if (gameState !== 'PLAYING') return;
            const spec = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
            const enemy = {
                x: Math.random() * 420 + 40,
                y: -40,
                vy: Math.random() * 1.5 + 1.5,
                hp: spec.hp,
                maxHp: spec.hp,
                score: spec.score,
                color: spec.color,
                type: spec.type,
                rot: 0
            };

            // Build Enemy SVG Group
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            
            // Downward Facing Mech Geometries
            if (spec.type === 'red-scout') {
                g.innerHTML = `
                    <polygon points="0,18 -18,-15 0,-8 18,-15" fill="${spec.color}" stroke="#f43f5e" stroke-width="1.5"/>
                    <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#neon-glow)"/>
                `;
            } else if (spec.type === 'orange-sniper') {
                g.innerHTML = `
                    <path d="M-15,-15 L15,-15 L20,0 L0,22 L-20,0 Z" fill="${spec.color}" stroke="#fb923c" stroke-width="1.5"/>
                    <line x1="-12" y1="-10" x2="-12" y2="5" stroke="#fef08a" stroke-width="2"/>
                    <line x1="12" y1="-10" x2="12" y2="5" stroke="#fef08a" stroke-width="2"/>
                `;
            } else if (spec.type === 'lime-bug') {
                g.innerHTML = `
                    <circle cx="0" cy="0" r="14" fill="${spec.color}" stroke="#a3e635" stroke-width="1.5"/>
                    <path d="M-10,-10 L-18,-20 M10,-10 L18,-20 M-10,10 L-16,18 M10,10 L16,18" stroke="#a3e635" stroke-width="2"/>
                `;
            } else {
                g.innerHTML = `
                    <rect x="-14" y="-14" width="28" height="28" fill="${spec.color}" rx="4" stroke="#c084fc" stroke-width="1.5" transform="rotate(45)"/>
                    <circle cx="0" cy="0" r="6" fill="#f0abfc" filter="url(#neon-glow)"/>
                `;
            }

            enemiesGroup.appendChild(g);
            enemy.elem = g;
            enemies.push(enemy);
        }

        function spawnPlayerBullet() {
            sound.playLaser();
            const offsets = power === 1 ? [0] : power === 2 ? [-12, 12] : [-18, 0, 18];
            offsets.forEach(off => {
                const b = { x: player.x + off, y: player.y - 20, vy: -12 };
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", b.x - 2.5);
                rect.setAttribute("y", b.y);
                rect.setAttribute("width", 5);
                rect.setAttribute("height", 16);
                rect.setAttribute("fill", "#38bdf8");
                rect.setAttribute("rx", "2.5");
                rect.setAttribute("filter", "url(#neon-glow)");
                playerBulletsGroup.appendChild(rect);
                b.elem = rect;
                playerBullets.push(b);
            });
        }

        function createExplosion(x, y, color = "#fb923c", count = 12) {
            sound.playExplode();
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                const p = {
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color
                };
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", Math.random() * 3 + 2);
                circle.setAttribute("fill", color);
                circle.setAttribute("filter", "url(#neon-glow)");
                particlesGroup.appendChild(circle);
                p.elem = circle;
                particles.push(p);
            }
        }

        function triggerBomb() {
            if (bombs <= 0) return;
            bombs--;
            document.getElementById('bomb-val').innerText = bombs;
            sound.playExplode();

            // Clear all enemy bullets & damage enemies
            enemyBullets.forEach(b => b.elem.remove());
            enemyBullets = [];

            enemies.forEach(e => {
                e.hp -= 10;
                createExplosion(e.x, e.y, "#f43f5e", 15);
            });

            if (boss.active) {
                boss.hp -= 40;
                createExplosion(boss.x, boss.y + 30, "#f43f5e", 25);
            }

            // Screen flash effect
            const flash = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            flash.setAttribute("width", "500");
            flash.setAttribute("height", "700");
            flash.setAttribute("fill", "#ffffff");
            flash.setAttribute("opacity", "0.8");
            svg.appendChild(flash);
            setTimeout(() => flash.remove(), 100);
        }

        function spawnBoss() {
            gameState = 'BOSS_STAGE';
            boss.active = true;
            sound.playBossWarning();
            document.getElementById('boss-warning-overlay').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('boss-warning-overlay').classList.add('hidden');
            }, 3000);

            bossHpContainer.classList.remove('hidden');
            document.getElementById('boss-timer-display').innerText = "⚠️ BOSS ENGAGED";
        }

        function updateBoss() {
            if (!boss.active) return;

            // Smooth entrance downward
            if (boss.y < boss.targetY) {
                boss.y += 2;
            } else {
                // Boss oscillation pattern
                boss.x = 250 + Math.sin(Date.now() * 0.0015) * 140;
            }

            // SVG TECH 10: Dynamic Mechanism Transformations
            boss.rotAngle += 1;
            bossRotator.setAttribute("transform", `rotate(${boss.rotAngle})`);

            boss.armOffset = Math.sin(Date.now() * 0.003) * 15;
            bossLeftArm.setAttribute("transform", `translate(-85, ${20 + boss.armOffset})`);
            bossRightArm.setAttribute("transform", `translate(85, ${20 - boss.armOffset})`);

            bossShip.setAttribute("transform", `translate(${boss.x}, ${boss.y})`);

            // Boss Attacks
            boss.shootTimer++;
            if (boss.shootTimer % 45 === 0 && boss.y >= boss.targetY) {
                // Ring Shot Pattern
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 / 8) * i + (boss.rotAngle * Math.PI / 180);
                    const eb = {
                        x: boss.x,
                        y: boss.y + 40,
                        vx: Math.cos(angle) * 3.5,
                        vy: Math.sin(angle) * 3.5
                    };
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("cx", eb.x);
                    circle.setAttribute("cy", eb.y);
                    circle.setAttribute("r", 5);
                    circle.setAttribute("fill", "#f43f5e");
                    circle.setAttribute("filter", "url(#neon-glow)");
                    enemyBulletsGroup.appendChild(circle);
                    eb.elem = circle;
                    enemyBullets.push(eb);
                }
            }

            // Update HP Bar
            const hpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
            bossHpBar.style.width = `${hpPct}%`;

            if (boss.hp <= 0) {
                // Boss Defeated
                createExplosion(boss.x, boss.y, "#f43f5e", 60);
                createExplosion(boss.x - 50, boss.y - 30, "#fb923c", 40);
                createExplosion(boss.x + 50, boss.y + 30, "#38bdf8", 40);
                boss.active = false;
                bossShip.setAttribute("transform", "translate(250, -300)");
                score += 5000;
                document.getElementById('score-val').innerText = score;
                triggerGameOver(true);
            }
        }

        let spawnCounter = 0;
        let lastTime = performance.now();

        function gameLoop(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;

            // Boss Countdown Timer
            if (gameState === 'PLAYING') {
                bossTimer -= dt;
                if (bossTimer <= 0) {
                    bossTimer = 0;
                    spawnBoss();
                } else {
                    document.getElementById('boss-timer-val').innerText = Math.ceil(bossTimer);
                }
            }

            // 1. Move Player
            if (keys.Up) player.y -= player.speed;
            if (keys.Down) player.y += player.speed;
            if (keys.Left) player.x -= player.speed;
            if (keys.Right) player.x += player.speed;

            player.x = Math.max(25, Math.min(475, player.x));
            player.y = Math.max(25, Math.min(675, player.y));
            playerShip.setAttribute("transform", `translate(${player.x}, ${player.y})`);

            // Flame Pulse Animation
            const flameScale = 0.8 + Math.random() * 0.4;
            playerEngineFire.setAttribute("transform", `scale(1, ${flameScale})`);

            // Barrier state
            playerBarrier.setAttribute("opacity", barrier > 0 ? "1" : "0");

            // 2. Stars Scrolling
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > 700) s.y = 0;
                s.elem.setAttribute("cy", s.y);
            });

            // 3. Player Bullets Move
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                b.y += b.vy;
                b.elem.setAttribute("y", b.y);

                // Collision with Boss
                if (boss.active && Math.hypot(b.x - boss.x, b.y - boss.y) < 90) {
                    boss.hp -= 2;
                    createExplosion(b.x, b.y, "#38bdf8", 3);
                    b.elem.remove();
                    playerBullets.splice(i, 1);
                    continue;
                }

                // Collision with Enemies
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < 22) {
                        e.hp--;
                        createExplosion(b.x, b.y, "#38bdf8", 4);
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, "#fb923c", 15);
                            score += e.score;
                            document.getElementById('score-val').innerText = score;
                            e.elem.remove();
                            enemies.splice(j, 1);

                            // Random Powerup
                            if (Math.random() < 0.25 && power < 3) {
                                power++;
                                sound.playPowerup();
                                document.getElementById('power-val').innerText = power === 3 ? "MAX" : power;
                            }
                        }
                        hit = true;
                        break;
                    }
                }

                if (hit) {
                    b.elem.remove();
                    playerBullets.splice(i, 1);
                } else if (b.y < -20) {
                    b.elem.remove();
                    playerBullets.splice(i, 1);
                }
            }

            // 4. Enemy Spawn & Move
            spawnCounter++;
            if (spawnCounter % 50 === 0 && gameState === 'PLAYING') {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.vy;
                e.elem.setAttribute("transform", `translate(${e.x}, ${e.y})`);

                // Enemy Shooting
                if (Math.random() < 0.008) {
                    const eb = { x: e.x, y: e.y + 15, vy: 4, vx: (player.x - e.x) * 0.005 };
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("cx", eb.x);
                    circle.setAttribute("cy", eb.y);
                    circle.setAttribute("r", 4);
                    circle.setAttribute("fill", "#a3e635");
                    circle.setAttribute("filter", "url(#neon-glow)");
                    enemyBulletsGroup.appendChild(circle);
                    eb.elem = circle;
                    enemyBullets.push(eb);
                }

                // Player Collision with Enemy
                if (Math.hypot(player.x - e.x, player.y - e.y) < 30) {
                    handlePlayerHit();
                    e.elem.remove();
                    enemies.splice(i, 1);
                    continue;
                }

                if (e.y > 730) {
                    e.elem.remove();
                    enemies.splice(i, 1);
                }
            }

            // 5. Enemy Bullets Move & Collision
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.x += eb.vx || 0;
                eb.y += eb.vy;
                eb.elem.setAttribute("cx", eb.x);
                eb.elem.setAttribute("cy", eb.y);

                if (Math.hypot(player.x - eb.x, player.y - eb.y) < 18) {
                    handlePlayerHit();
                    eb.elem.remove();
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (eb.y > 720 || eb.x < 0 || eb.x > 500) {
                    eb.elem.remove();
                    enemyBullets.splice(i, 1);
                }
            }

            // 6. Update Boss Mechanism
            updateBoss();

            // 7. Update Particle Explosions
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.elem.setAttribute("cx", p.x);
                p.elem.setAttribute("cy", p.y);
                p.elem.setAttribute("opacity", p.life);

                if (p.life <= 0) {
                    p.elem.remove();
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function handlePlayerHit() {
            if (barrier > 0) {
                barrier--;
                document.getElementById('barrier-val').innerText = barrier;
                createExplosion(player.x, player.y, "#38bdf8", 15);
                return;
            }

            lives--;
            createExplosion(player.x, player.y, "#f43f5e", 25);
            let heartStr = "";
            for (let i = 0; i < lives; i++) heartStr += "❤️";
            document.getElementById('lives-val').innerText = heartStr || "💀";

            if (lives <= 0) {
                triggerGameOver(false);
            }
        }

        function triggerGameOver(isWin) {
            gameState = 'GAMEOVER';
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('beam_shoots_hiscore', hiScore);
                document.getElementById('hiscore-val').innerText = hiScore;
            }

            const overlay = document.getElementById('game-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('final-score');

            if (isWin) {
                title.innerText = "MISSION COMPLETE!";
                title.className = "text-3xl font-black mb-2 text-emerald-400 neon-text-blue";
            } else {
                title.innerText = "GAME OVER";
                title.className = "text-3xl font-black mb-2 text-rose-500 neon-text-red";
            }

            desc.innerText = score;
            overlay.classList.remove('hidden');
        }

        // Run Game Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
